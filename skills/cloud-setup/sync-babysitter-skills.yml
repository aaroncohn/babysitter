name: sync babysitter skills

# Copies the latest babysitter skills into .claude/skills/babysitter-*/ and pushes any change to the default
# branch, so a new cloud workspace's / picker lists them from its first moment. Added by /babysitter:cloud-setup.
# If your repo requires a particular commit author, or protects the default branch, change the last step.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-babysitter-skills

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: copy the latest skills
        run: |
          git clone --quiet --depth 1 https://github.com/aaroncohn/babysitter.git "$RUNNER_TEMP/babysitter"
          python3 "$RUNNER_TEMP/babysitter/skills/cloud-setup/cloud-setup.py" vendor .claude/skills --from "$RUNNER_TEMP/babysitter"
      - name: push any change
        run: |
          git add .claude/skills
          if git diff --cached --quiet; then echo "skills are current"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -m "sync babysitter skills"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
